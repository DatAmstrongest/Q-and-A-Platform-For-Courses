apiVersion: v1
kind: Service
metadata:
  name: qa-api
  namespace: default
  labels:
    operated-prometheus: "true"
spec:
  selector:
    app: qa-api
  ports:
    - name: qa-api-service
      protocol: TCP
      port: 7777
      targetPort: 7777
    - name: prometheus-exporter
      protocol: TCP
      port: 9101
      targetPort: 9100
